[project]
name = "crypto-divergence-analyzer-backend"
version = "0.1.0"
description = "FastAPI backend for crypto divergence scoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

